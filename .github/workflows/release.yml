name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: hooksmith
            archive_cmd: tar -czf
            archive_ext: .tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: hooksmith
            archive_cmd: tar -czf
            archive_ext: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: hooksmith
            archive_cmd: tar -czf
            archive_ext: .tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hooksmith.exe
            archive_ext: .zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="${{ matrix.binary }}-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.archive_ext }}"
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
          echo "ARCHIVE=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARCHIVE_NAME = "${{ matrix.binary }}-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.archive_ext }}"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -DestinationPath $ARCHIVE_NAME
          echo "ARCHIVE=$ARCHIVE_NAME" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create release on GitHub
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true